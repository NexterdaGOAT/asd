<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Andy's Island: Nocturnal Terror</title>
    <style>
        body {
            margin: 0;
            background: #020503;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            position: absolute;
            top: 15px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #11ff99;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0,255,100,0.5);
        }
        #stats {
            font-size: 0.95rem;
            background: rgba(1, 6, 3, 0.9);
            padding: 8px 20px;
            border: 1px solid #114422;
            border-radius: 4px;
            display: inline-block;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 60px rgba(0,0,0,1);
            border: 2px solid #0d2615;
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>ANDY'S ISLAND: NOCTURNAL TERROR</h1>
    <div id="stats">Initializing Night Ops...</div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const MAP_SIZE = 16;

/* 
  Map Codes:
  1 = Foliage/Terrain Barrier
  0 = Open Path
  2 = Southern Escape Boat Dock
  
  Regions (Divided into 4 quadrants):
  - Top-Left  (Rows 0-7, Cols 0-7)   -> [Sector A: Dead Marshes]   (Dull Gray-Green Walls)
  - Top-Right (Rows 0-7, Cols 8-15)  -> [Sector B: Whispering Vines] (Bright Poison Green Walls)
  - Bot-Left  (Rows 8-15, Cols 0-7)  -> [Sector C: Shadowed Cliffs]  (Dark Stony Blue Walls)
  - Bot-Right (Rows 8-15, Cols 8-15) -> [Sector D: Ancient Ruins]   (Weathered Brown Walls)
*/
const islandMapLayout = [
    "1111111111111111",
    "1000000100000001",
    "1011110101111101",
    "1010000101000101",
    "1010110101010101",
    "1000100000010001",
    "1110111111110111",
    "1000000100000001",
    "1110111111110111",
    "1000100000010001",
    "1010110101010101",
    "1010000101000101",
    "1011110101111101",
    "1000000100000001",
    "1111111112111111",
    "1111111111111111"
];

let islandMap = [];
for(let r=0; r<MAP_SIZE; r++) {
    let row = [];
    for(let c=0; c<MAP_SIZE; c++) {
        islandMap.push(row.push(parseInt(islandMapLayout[r][c])));
    }
    islandMap.push(row);
}

// Fixed explicit initialization mapping to match logic safely
islandMap = islandMapLayout.map(row => row.split('').map(char => parseInt(char)));

let gameState = 'INTRO_CUTSCENE'; 
let cutsceneTimer = 0;
let cutsceneStage = 0;

let player = {
    x: 1.5, y: 1.5,
    angle: 0.5,
    fov: Math.PI / 3,
    speed: 0.048,
    partsCollected: 0,
    totalParts: 4
};

let andy = {
    x: 14.5, y: 14.5,
    speed: 0.024,
    heightModifier: 1.5,
    widthModifier: 0.4
};

// Placing 1 unique item in each of the 4 quadrants!
let boatParts = [
    {x: 2.5, y: 5.5,  type: 'Propeller',  sector: 'Dead Marshes',     collected: false}, // Top-Left
    {x: 13.5, y: 2.5, type: 'Spark Plug', sector: 'Whispering Vines', collected: false}, // Top-Right
    {x: 2.5, y: 11.5, type: 'Fuel Tank',  sector: 'Shadowed Cliffs',  collected: false}, // Bottom-Left
    {x: 13.5, y: 11.5,type: 'Battery',    sector: 'Ancient Ruins',    collected: false}  // Bottom-Right
];

let keys = {};
let depthBuffer = [];

canvas.addEventListener('click', () => {
    if (gameState === 'PLAYING' && !document.pointerLockElement) {
        canvas.requestPointerLock();
    }
});

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas && gameState === 'PLAYING') {
        player.angle += e.movementX * 0.0028;
    }
});

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.code === 'Space') {
        if (gameState === 'INTRO_CUTSCENE' && cutsceneStage >= 3) {
            gameState = 'PLAYING';
            canvas.requestPointerLock();
        } else if (gameState === 'JUMPSCARE' && cutsceneTimer > 50) {
            resetGame();
        } else if (gameState === 'OUTRO_CUTSCENE' && cutsceneStage >= 2) {
            resetGame();
        }
    }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function resetGame() {
    player.x = 1.5; player.y = 1.5; player.angle = 0.5; player.partsCollected = 0;
    andy.x = 14.5; andy.y = 14.5;
    boatParts.forEach(p => p.collected = false);
    gameState = 'INTRO_CUTSCENE';
    cutsceneStage = 0;
    cutsceneTimer = 0;
    document.exitPointerLock();
}

function getSectorName(x, y) {
    let r = Math.floor(y);
    let c = Math.floor(x);
    if (r < 8 && c < 8) return 'Dead Marshes';
    if (r < 8 && c >= 8) return 'Whispering Vines';
    if (r >= 8 && c < 8) return 'Shadowed Cliffs';
    return 'Ancient Ruins';
}

function getSectorColor(name, brightness) {
    // Return specific tinted RGB structures for different environment zones
    if (name === 'Dead Marshes') return `rgba(50, 70, 60, ${brightness})`;       // Swamp Gray-Green
    if (name === 'Whispering Vines') return `rgba(15, 110, 35, ${brightness})`;  // Dense Poison Emerald
    if (name === 'Shadowed Cliffs') return `rgba(35, 50, 85, ${brightness})`;   // Dark Coastal Stone Blue
    return `rgba(95, 70, 50, ${brightness})`;                                   // Archaic Clay Brown
}

function update() {
    if (gameState === 'INTRO_CUTSCENE' || gameState === 'OUTRO_CUTSCENE') {
        cutsceneTimer++;
        if (cutsceneTimer > 180) {
            cutsceneTimer = 0;
            cutsceneStage++;
        }
        return;
    }

    if (gameState === 'JUMPSCARE') {
        cutsceneTimer++;
        return;
    }

    if (gameState !== 'PLAYING') return;

    let moveX = 0, moveY = 0;
    if (keys['w']) { moveX += Math.cos(player.angle) * player.speed; moveY += Math.sin(player.angle) * player.speed; }
    if (keys['s']) { moveX -= Math.cos(player.angle) * player.speed; moveY -= Math.sin(player.angle) * player.speed; }
    if (keys['a']) { moveX += Math.sin(player.angle) * player.speed; moveY -= Math.cos(player.angle) * player.speed; }
    if (keys['d']) { moveX -= Math.sin(player.angle) * player.speed; moveY += Math.cos(player.angle) * player.speed; }

    if (islandMap[Math.floor(player.y)][Math.floor(player.x + moveX)] !== 1) player.x += moveX;
    if (islandMap[Math.floor(player.y + moveY)][Math.floor(player.x)] !== 1) player.y += moveY;

    for (let part of boatParts) {
        if (!part.collected && Math.hypot(player.x - part.x, player.y - part.y) < 0.5) {
            part.collected = true;
            player.partsCollected++;
        }
    }

    if (islandMap[Math.floor(player.y)][Math.floor(player.x)] === 2) {
        if (player.partsCollected >= player.totalParts) {
            gameState = 'OUTRO_CUTSCENE';
            cutsceneStage = 0;
            cutsceneTimer = 0;
            document.exitPointerLock();
            return;
        }
    }

    let dx = player.x - andy.x, dy = player.y - andy.y;
    let distToAndy = Math.hypot(dx, dy);
    let currentAndySpeed = andy.speed + (player.partsCollected * 0.0055);

    let angleToPlayer = Math.atan2(dy, dx);
    let nax = andy.x + Math.cos(angleToPlayer) * currentAndySpeed;
    let nay = andy.y + Math.sin(angleToPlayer) * currentAndySpeed;

    if (islandMap[Math.floor(andy.y)][Math.floor(nax)] !== 1) andy.x = nax;
    if (islandMap[Math.floor(nay)][Math.floor(andy.x)] !== 1) andy.y = nay;

    if (distToAndy < 0.38) {
        gameState = 'JUMPSCARE';
        cutsceneTimer = 0;
        document.exitPointerLock();
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let statsEl = document.getElementById('stats');

    if (gameState === 'INTRO_CUTSCENE') {
        statsEl.innerText = "NIGHTFALL PROTOCOL";
        ctx.fillStyle = '#010502'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#11ff99'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';

        if (cutsceneStage === 0) {
            ctx.fillText("OPERATION NIGHTFALL: COVERT ISLAND INFILTRATION", canvas.width/2, 230);
            ctx.fillText("4 CIA Operators were hunting the tall entity in pitch darkness.", canvas.width/2, 270);
            ctx.fillText("Radio static cut off their positions completely.", canvas.width/2, 310);
        } else if (cutsceneStage === 1) {
            ctx.fillText("THE RECON REPORTS SHOWED A SECTORIZED WEB:", canvas.width/2, 200);
            ctx.fillStyle = '#99aa99'; ctx.fillText("1. Northwest Quadrant -> Dead Marshes", canvas.width/2, 240);
            ctx.fillStyle = '#11ff55'; ctx.fillText("2. Northeast Quadrant -> Whispering Vines", canvas.width/2, 270);
            ctx.fillStyle = '#4477ff'; ctx.fillText("3. Southwest Quadrant -> Shadowed Cliffs", canvas.width/2, 300);
            ctx.fillStyle = '#cc8855'; ctx.fillText("4. Southeast Quadrant -> Ancient Ruins", canvas.width/2, 330);
        } else if (cutsceneStage === 2) {
            ctx.fillStyle = '#11ff99';
            ctx.fillText("Each fallen operative dropped an essential escape component", canvas.width/2, 230);
            ctx.fillText("hidden deep within their designated sector boundaries.", canvas.width/2, 270);
            ctx.fillText("Andy tracks better in the night air. Keep moving.", canvas.width/2, 310);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillText("FIND ALL 4 PARTS AND REPAIR THE DOCK BOAT TO ESCAPE", canvas.width/2, 240);
            ctx.fillStyle = '#11ff99';
            ctx.fillText("PRESS [SPACEBAR] TO STEALTH DEPLOY IN THE INK-BLACK MIDNIGHT", canvas.width/2, 340);
        }
        return;
    }

    if (gameState === 'OUTRO_CUTSCENE') {
        statsEl.innerText = "SUCCESSFUL EXTRACTION";
        ctx.fillStyle = '#000803'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';

        if (cutsceneStage === 0) {
            ctx.fillText("The escape boat engine purrs to life amidst the shoreline fog.", canvas.width/2, 240);
            ctx.fillText("You slip away unnoticed into the freezing ocean tides.", canvas.width/2, 280);
        } else if (cutsceneStage === 1) {
            ctx.fillText("Looking back through your tactical NVG lens...", canvas.width/2, 240);
            ctx.fillText("Andy stands on the dark cliffs watching your boat disappear.", canvas.width/2, 280);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillText("YOU HAVE CONQUERED THE SECTORS OF THE ISLAND!", canvas.width/2, 240);
            ctx.fillText("PRESS [SPACEBAR] TO SIMULATE AGAIN", canvas.width/2, 340);
        }
        return;
    }

    if (gameState === 'JUMPSCARE') {
        statsEl.innerText = "TARGET NEUTRALIZED";
        let isRedFlash = Math.floor(cutsceneTimer / 3) % 2 === 0;
        ctx.fillStyle = isRedFlash ? '#4a0000' : '#080000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Towering silhouette face zoom-in mechanics
        ctx.fillStyle = '#000000'; ctx.fillRect(250, 80, 300, 520);
        ctx.fillStyle = '#cfbcae'; ctx.fillRect(320, 130, 160, 160);
        ctx.fillStyle = isRedFlash ? '#ff0000' : '#220000';
        ctx.fillRect(350, 190, 25, 15); ctx.fillRect(420, 190, 25, 15); // Staring void eyes

        ctx.fillStyle = '#ff2222'; ctx.font = 'bold 38px Courier New'; ctx.textAlign = 'center';
        ctx.fillText("ANDY CONSUMED YOU IN THE DARK", canvas.width/2, 440);

        if (cutsceneTimer > 50) {
            ctx.fillStyle = '#ffffff'; ctx.font = '14px Courier New';
            ctx.fillText("PRESS [SPACEBAR] FOR ANOTHER STRATAGEM DEPLOYMENT", canvas.width/2, 510);
        }
        return;
    }

    // --- PITCH BLACK NIGHTTIME 3D RAYCAST ENGINE ---
    // Sky is starry midnight dark blue-black; ground is damp dark earth
    ctx.fillStyle = '#010408'; ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
    ctx.fillStyle = '#0d0a07'; ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    depthBuffer = [];
    const numRays = canvas.width;
    for (let i = 0; i < numRays; i++) {
        let rayAngle = (player.angle - player.fov / 2) + (i / numRays) * player.fov;
        let distanceToWall = 0; let hitWall = false; let hitType = 1;
        let wallX = 0, wallY = 0;
        let eyeX = Math.cos(rayAngle), eyeY = Math.sin(rayAngle);

        while (!hitWall && distanceToWall < 14) {
            distanceToWall += 0.038;
            wallX = player.x + eyeX * distanceToWall;
            wallY = player.y + eyeY * distanceToWall;
            let checkX = Math.floor(wallX);
            let checkY = Math.floor(wallY);

            if (checkX < 0 || checkX >= MAP_SIZE || checkY < 0 || checkY >= MAP_SIZE) {
                hitWall = true; distanceToWall = 14;
            } else if (islandMap[checkY][checkX] === 1) {
                hitWall = true; hitType = 1;
            } else if (islandMap[checkY][checkX] === 2) {
                hitWall = true; hitType = 2;
            }
        }

        let correctedDist = distanceToWall * Math.cos(rayAngle - player.angle);
        depthBuffer.push(correctedDist);

        let ceiling = (canvas.height / 2) - (canvas.height / correctedDist);
        let floor = canvas.height - ceiling;
        let wallHeight = floor - ceiling;
        
        // HEAVY STEALTH VIGNETTE - Distant objects fade to 0 visible clarity quickly (NIGHT EFFECT)
        let brightness = Math.max(0, 1 - (correctedDist / 7.2)); 

        if (hitType === 2) {
            ctx.fillStyle = `rgba(130, 70, 25, ${brightness})`; // Southern Wooden Boat Escape Dock
        } else {
            let sector = getSectorName(wallX, wallY);
            ctx.fillStyle = getSectorColor(sector, brightness);
        }
        ctx.fillRect(i, ceiling, 1, wallHeight);

        // Render distinct structural texture shadows depending on quadrants
        if (hitType === 1 && i % 40 === 0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${brightness * 0.7})`;
            ctx.fillRect(i, ceiling, 2, wallHeight);
        }
    }

    // --- STAR CONSTELLATION EMBELLISHMENT ---
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for(let s=0; s<20; s++) {
        let starX = (s * 43 + 50) % canvas.width;
        let starY = (s * 17 + 20) % (canvas.height / 3);
        ctx.fillRect(starX, starY, 1.5, 1.5);
    }

    // --- SPRITE GENERATION HIERARCHY ---
    let sprites = [];
    boatParts.forEach(p => { if(!p.collected) sprites.push({x: p.x, y: p.y, type: 'part', label: p.type, sector: p.sector}); });
    sprites.push({x: andy.x, y: andy.y, type: 'andy'});

    sprites.sort((a, b) => Math.hypot(player.x - b.x, player.y - b.y) - Math.hypot(player.x - a.x, player.y - a.y));

    sprites.forEach(sprite => {
        let sx = sprite.x - player.x, sy = sprite.y - player.y;
        let spriteAngle = Math.atan2(sy, sx) - player.angle;
        while (spriteAngle < -Math.PI) spriteAngle += Math.PI * 2;
        while (spriteAngle > Math.PI) spriteAngle -= Math.PI * 2;

        let dist = Math.hypot(sx, sy);
        if (dist < 0.25 || Math.abs(spriteAngle) > player.fov) return;

        let spriteSize = Math.abs(canvas.height / dist);
        let alpha = Math.max(0, 1 - (dist / 7.5)); // Night stealth alpha cutoff limit

        if (sprite.type === 'andy') {
            let tallHeight = spriteSize * andy.heightModifier;
            let narrowWidth = spriteSize * andy.widthModifier;
            let tallScreenY = (canvas.height / 2) - (tallHeight / 1.6);
            let adjustedScreenX = (canvas.width / 2) + (Math.tan(spriteAngle) * (canvas.width / 2)) - (narrowWidth / 2);

            for (let col = 0; col < narrowWidth; col++) {
                let pixelX = Math.floor(adjustedScreenX + col);
                if (pixelX >= 0 && pixelX < canvas.width && depthBuffer[pixelX] > dist) {
                    ctx.fillStyle = `rgba(10, 15, 12, ${alpha * 0.95})`; // Lanky dark shadow structure body
                    ctx.fillRect(pixelX, tallScreenY, 1, tallHeight);
                    ctx.fillStyle = `rgba(185, 170, 160, ${alpha})`; // Masking pale white face skin
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.35), tallScreenY + (tallHeight * 0.05), narrowWidth * 0.3, tallHeight * 0.12);
                    ctx.fillStyle = '#ff1111'; // Pure demonic tracking eyes glowing at night
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.42), tallScreenY + (tallHeight * 0.08), narrowWidth * 0.05, tallHeight * 0.02);
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.53), tallScreenY + (tallHeight * 0.08), narrowWidth * 0.05, tallHeight * 0.02);
                }
            }
        } else {
            let spriteScreenX = (canvas.width / 2) + (Math.tan(spriteAngle) * (canvas.width / 2)) - (spriteSize / 4);
            let spriteScreenY = (canvas.height / 2) + (spriteSize * 0.12);
            let partWidth = spriteSize * 0.35;

            for (let col = 0; col < partWidth; col++) {
                let pixelX = Math.floor(spriteScreenX + col);
                if (pixelX >= 0 && pixelX < canvas.width && depthBuffer[pixelX] > dist) {
                    // Pulsating bioluminescent neon yellow tone for item clarity
                    let pulse = 1 + Math.sin(Date.now() * 0.006) * 0.15;
                    ctx.fillStyle = `rgba(240, 255, 30, ${alpha * pulse})`;
                    ctx.fillRect(pixelX, spriteScreenY, 1, spriteSize * 0.2);
                }
            }
        }
    });

    // Flashlight beam vignette projection simulation
    let flashGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 10, canvas.width / 2, canvas.height / 2, 280);
    flashGrad.addColorStop(0, 'rgba(255,255,240,0.04)'); 
    flashGrad.addColorStop(0.4, 'rgba(0,10,5,0.45)'); 
    flashGrad.addColorStop(1, 'rgba(0,1,0,0.99)');
    ctx.fillStyle = flashGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Crosshair target vector helper
    ctx.fillStyle = 'rgba(20, 255, 120, 0.4)'; ctx.fillRect(canvas.width / 2 - 1, canvas.height / 2 - 1, 2, 2);

    // Active Sector Context Mapping UI
    let currentSector = getSectorName(player.x, player.y);
    let partsLeft = player.totalParts - player.partsCollected;
    
    let uiStatus = `[Sector: ${currentSector}] | Parts Secured: ${player.partsCollected}/4`;
    if (partsLeft === 0) {
        uiStatus = `<span style="color:#11ff99; font-weight:bold;">ALL PARTS SECURED! ENGAGE EXTRACTION BOAT AT THE SOUTHERN WALL BASE</span>`;
    }
    
    statsEl.innerHTML = uiStatus;
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
